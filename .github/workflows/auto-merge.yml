name: Auto-merge validated pull requests
on:
  workflow_run:
    workflows: ["Validate VSETKO24"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
jobs:
  merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Squash merge validated internal pull requests
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = run.pull_requests || [];
            // Missing suite metadata must never match another check with an undefined suite ID.
            if (!Number.isSafeInteger(run.check_suite_id) || run.check_suite_id <= 0) {
              core.warning('Skipping auto-merge: missing or invalid validation check suite ID.');
              return;
            }
            for (const item of prs) {
              const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:item.number});
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main') continue;
              if (pr.head.repo.full_name !== `${owner}/${repo}`) continue;
              if (pr.head.sha !== run.head_sha) continue;
              // GitHub may report null while computing mergeability. Never merge without a conflict-free result.
              if (pr.mergeable !== true) {
                core.warning(`Skipping PR #${pr.number}: GitHub has not confirmed a conflict-free merge.`);
                continue;
              }
              // A PR may rewrite its own validation workflow to produce a green but untrusted CI result.
              // Require a manual review for any GitHub Actions workflow change.
              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,repo,pull_number:pr.number,per_page:100
              });
              if (pr.changed_files >= 3000 || changedFiles.length !== pr.changed_files) {
                core.warning(`Skipping PR #${pr.number}: cannot verify the complete changed-file list.`);
                continue;
              }
              // A PR can change repository security policy (e.g. CODEOWNERS, Dependabot),
              // redefine npm test/build, or alter CI inputs. Require manual review.
              const isSensitive = path => typeof path === 'string' && (
                path.startsWith('.github/') ||
                path.startsWith('scripts/') ||
                path.startsWith('tests/') ||
                // Backend handlers and Cloudflare redirects can affect data security and routing.
                path.startsWith('functions/') ||
                path === 'public/_redirects' ||
                // Cloudflare Pages security headers, routing and deployment config require review.
                ['package.json', 'package-lock.json', 'npm-shrinkwrap.json', '.npmrc', 'astro.config.mjs',
                 'public/_headers', 'public/_routes.json', 'public/_worker.js',
                 'wrangler.toml', 'wrangler.json', 'wrangler.jsonc'].includes(path)
              );
              if (changedFiles.some(file => isSensitive(file.filename) || isSensitive(file.previous_filename))) {
                core.warning(`Skipping PR #${pr.number}: CI-defining files require manual review.`);
                continue;
              }
              // Successful CI must not override a human request for changes.
              // COMMENTED does not clear a prior CHANGES_REQUESTED decision.
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,repo,pull_number:pr.number,per_page:100
              });
              const reviewerDecisions = new Map();
              let unattributedChangeRequest = false;
              for (const review of reviews) {
                if (review.state === 'CHANGES_REQUESTED' && !review.user?.login) {
                  unattributedChangeRequest = true;
                }
                if (review.user?.login && ['CHANGES_REQUESTED', 'APPROVED', 'DISMISSED'].includes(review.state)) {
                  reviewerDecisions.set(review.user.login, review.state);
                }
              }
              if (unattributedChangeRequest || [...reviewerDecisions.values()].includes('CHANGES_REQUESTED')) {
                core.warning(`Skipping PR #${pr.number}: an unresolved changes-requested review requires manual review.`);
                continue;
              }
              const {data: checks} = await github.rest.checks.listForRef({owner,repo,ref:pr.head.sha,per_page:100});
              const validation = checks.check_runs.filter(c => c.name === 'verify' && c.app?.slug === 'github-actions' && c.check_suite?.id === run.check_suite_id);
              if (!validation.some(c => c.conclusion === 'success')) continue;
              // The PR snapshot can become stale while a merge workflow is running.
              const {data: mainRef} = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
              const currentMain = mainRef.object.sha;
              if (pr.base.sha !== currentMain) {
                core.warning(`Skipping PR #${pr.number}: main moved since the PR snapshot; rerun validation.`);
                continue;
              }
              // A successful check for an older base is not proof of compatibility with current main.
              const {data: comparison} = await github.rest.repos.compareCommits({
                owner,repo,base:pr.head.sha,head:currentMain
              });
              if (comparison.ahead_by !== 0) {
                core.warning(`Skipping PR #${pr.number}: head is missing ${comparison.ahead_by} commit(s) from main; update the branch and rerun CI.`);
                continue;
              }
              try {
                const merged = await github.rest.pulls.merge({
                  owner,repo,pull_number:pr.number,merge_method:'squash',sha:pr.head.sha
                });
                core.info(`Merged PR #${pr.number}: ${merged.data.sha}`);
              } catch (error) {
                core.warning(`PR #${pr.number} was not merged: ${error.message}`);
                throw error;
              }
            }
