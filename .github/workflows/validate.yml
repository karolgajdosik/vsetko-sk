name: Validate VSETKO24
on:
  pull_request:
  push:
    branches: [main, release/v1.0-platform]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser layout audit
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/vsetko-preview.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4321/ > /dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4321/ >/dev/null || { cat /tmp/vsetko-preview.log; exit 1; }
          node tests/browser-layout.mjs
          node tests/browser-assistant.mjs
          VSETKO_ORIGIN=http://127.0.0.1:4321 node scripts/check-production-ui.mjs
          VSETKO_ORIGIN=http://127.0.0.1:4321 node tests/production-mobile-calculators.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: responsive-layout-screenshots
          path: |
            layout-*.png
            production-mobile-*.png
          if-no-files-found: ignore
